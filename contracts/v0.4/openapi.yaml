openapi: 3.1.1
info:
  title: Career Evidence API contracts
  version: 0.4.0
  description: 기획 v0.2/UI v0.3 기반 구현 전 계약. 실행 서비스가 아님. 자체 테스트 폼·합성 프로필 전용. JSON Schema는 schemas/domain.schema.json이
    권위. 외부 provider API는 LINER_ADAPTER.md 별도.
servers:
- url: /
  description: 동일 origin TS 서비스
tags:
- name: Session
- name: Core
- name: Tasks
- name: Applications
- name: Submission
paths:
  /api/v1/demo/session:
    post:
      operationId: createDemoSession
      tags:
      - Session
      summary: 합성 데이터 전용 workspace 세션 시작
      description: DEMO_MODE에서만 제공. 정확한 Origin/Host 검사. 유효한 기존 세션이면 같은 workspace를 반환. 공개 사용자 인증으로 확대하지 않음.
      security: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'HTTPS: __Host-ce_session; Secure; HttpOnly; SameSite=Strict; Path=/. 로컬 HTTP에서는 개발용
                host-only 이름 사용.'
        '400':
          description: 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 세션 없음/만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin·CSRF·범위 거절
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 현재 workspace에서 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 현재 상태·버전·중복 키 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 유효성 또는 근거 연결 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 호출/예산 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 저장소/worker 일시 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: 설정된 DEMO_ORIGIN과 정확히 일치. 브라우저가 전송.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/session:
    get:
      operationId: getSession
      tags:
      - Session
      summary: 현재 세션·기능·CSRF 조회
      description: 웹 페이지 전용. CSRF/쿠키 정보는 확장 bridge로 반환하지 않음.
      security: &id001
      - sessionCookie: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 형식 오류
          content:
            application/json:
              schema:
