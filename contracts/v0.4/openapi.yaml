              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 유효성 또는 근거 연결 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 호출/예산 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 저장소/worker 일시 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: 설정된 DEMO_ORIGIN과 정확히 일치. 브라우저가 전송.
      - &id003
        name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
        description: workspace + operationId + key 범위. request_hash=SHA256(UTF8(method + LF + 정규화된 실제 path + LF
          + JCS(body))). 같은 key의 대상/path/body 차이는 409. 새 재시도만 새 key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextCreate'
