        해제 선언 크기 초과는 415다(v0.7.2, DECISIONS S1-12). 업로드/추출 task를 영속 저장한다. synthetic 여부는 서버 fixture
        경로로만 결정하고 사용자가 소유 범위를 지정할 수 없다. file hash는 실제 원본 bytes로 계산한다.
