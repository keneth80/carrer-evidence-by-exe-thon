            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Problem
        '404':
          description: 현재 소유 범위에서 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Problem
        '409':
          description: revision·상태·중복·idempotency 충돌
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Problem
        '422':
