      - sessionCookie: []
      parameters: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/ProductSession
        '400':
          description: 형식 오류
          content:
            application/json:
              schema:
                $ref: ./schemas/domain.schema.json#/$defs/Problem
        '401':
