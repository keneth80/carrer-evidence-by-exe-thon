openapi: 3.1.1
info:
  title: Career Evidence integrated product API
  version: 0.7.0
  description: 통합 설계 계약. 제품 handler는 미구현이며 기존 v0.4 demo API와 신규 경로를 구분한다. workspace_id는
    서버 인증에서 정한다. 소유 범위 검증 없는 demo session은 실제 사용자 파일 저장 권한이 아니다.
